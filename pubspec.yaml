name: shimnote
description: "쉼노트 - 목소리로 감정을 기록하고 힐링 사운드를 추천받는 앱 (팀 프로젝트 UI)"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.27 이상 (Dart 3.6 이상)
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 목업에서 사용한 폰트(Noto Sans KR, Gowun Dodum)를 불러옵니다.
  google_fonts: ^6.2.1
  # 목업의 SVG 아이콘을 그대로 그리기 위해 사용합니다.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 앱을 켤 때 처음 보이는 시작 화면(네이티브 스플래시)을 쉼노트 로고로 바꿉니다.
  flutter_native_splash: ^2.4.1
  # 휴대폰 홈 화면의 앱 아이콘을 쉼노트 로고로 바꿉니다.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── 앱 아이콘 설정 ──
# 바꾼 뒤에는 터미널에서: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#E4FBF5"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

# ── 시작 화면(네이티브 스플래시) 설정 ──
# 바꾼 뒤에는 터미널에서: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E4FBF5"
  image: assets/images/splash_logo.png
  # 안드로이드 12 이상은 가운데에 동그란 아이콘 하나만 보여 줘서,
  # 물방울(아이콘)과 ShimNote 글자(아래쪽 브랜드 자리)를 나눠서 넣어요.
  android_12:
    color: "#E4FBF5"
    image: assets/images/splash_android12.png
    icon_background_color: "#E4FBF5"
    branding: assets/images/splash_branding.png
  web: false
